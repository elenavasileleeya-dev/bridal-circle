<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bridal Circle — AI Bridal Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Departure+Mono&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root {
  --black: #FAF7F1;
  --white: #1A1814;
  --ivory: #F5EFE6;
  --ink: #14120E;
  --bg: #FAF7F1;
  --bg-alt: #F0E9DC;
  --bg-card: #FFFFFF;
  --orange: #CB102C;
  --orange-2: #DA2238;
  --red: #CB102C;
  --red-deep: #A30D23;
  --ink-card: #FFFFFF;
  --card-2: #FFFFFF;
  --line: rgba(20,18,14,0.08);
  --line-strong: rgba(20,18,14,0.18);
  --muted: #6E6557;
  --warm-tint: rgba(203, 16, 44, 0.10);

  --max: 1280px;
  --gutter: clamp(20px, 4vw, 56px);
  --r-lg: 36px;
  --r-md: 28px;
  --r-sm: 16px;

  --f-display: "Fraunces", "Times New Roman", serif;
  --f-mono: "Helvetica Neue", "Helvetica", "Inter", "Arial", sans-serif;
  --f-ui: "Inter", -apple-system, sans-serif;
  --f-body: "Inter", -apple-system, sans-serif;
  --f-script: "Tangerine", "Snell Roundhand", cursive;

  --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-theme="dark"] {
  --bg: #0E0C09;
  --bg-alt: #15120D;
  --bg-card: #1A1714;
  --black: #0E0C09;
  --white: #F5EFE6;
  --ink: #F5EFE6;
  --line: rgba(255,255,255,0.10);
  --line-strong: rgba(255,255,255,0.22);
  --muted: #A8A096;
  --ink-card: #1A1714;
  --card-2: #1A1714;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
html { scroll-behavior: smooth; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--red); color: #fff; }

/* ======= Scroll-reveal motion ======= */
.reveal {
  opacity: 0;
  transform: translateY(36px);
  transition: opacity 1.1s var(--ease-soft), transform 1.1s var(--ease-soft);
  will-change: opacity, transform;
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-stagger > * {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.9s var(--ease-soft), transform 0.9s var(--ease-soft);
}
.reveal-stagger.is-visible > * { opacity: 1; transform: translateY(0); }
.reveal-stagger.is-visible > *:nth-child(1) { transition-delay: 0.05s; }
.reveal-stagger.is-visible > *:nth-child(2) { transition-delay: 0.15s; }
.reveal-stagger.is-visible > *:nth-child(3) { transition-delay: 0.25s; }
.reveal-stagger.is-visible > *:nth-child(4) { transition-delay: 0.35s; }
.reveal-stagger.is-visible > *:nth-child(5) { transition-delay: 0.45s; }
.reveal-stagger.is-visible > *:nth-child(6) { transition-delay: 0.55s; }

@keyframes floatGlow {
  0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 20px 60px rgba(203, 16, 44, 0.18)); }
  50% { transform: translateY(-12px) scale(1.01); filter: drop-shadow(0 30px 80px rgba(203, 16, 44, 0.32)); }
}
@keyframes spinSlow {
  to { transform: rotate(360deg); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(203, 16, 44, 0.5), 0 12px 40px rgba(203, 16, 44, 0.25); }
  50% { box-shadow: 0 0 0 14px rgba(203, 16, 44, 0), 0 18px 50px rgba(203, 16, 44, 0.4); }
}

.shell { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

.display { font-family: var(--f-display); font-weight: 400; letter-spacing: 0.01em; line-height: 0.95; text-transform: uppercase; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.eyebrow-on-light { color: rgba(0,0,0,0.65); }
.body-sm { font-size: 13px; line-height: 1.55; color: var(--muted); max-width: 38ch; }

/* ============== HERO (white) ============== */
.hero {
  background: var(--bg);
  color: var(--ink);
  position: relative;
  padding: 0;
  overflow: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.hero-bg {
  position: absolute;
  inset: -8% -2% -2% -2%;
  background-image: url('assets/hero-bride.png');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  z-index: 0;
  will-change: transform;
  transform: translate3d(0, var(--parallax, 0px), 0) scale(1.05);
  transition: transform 0.05s linear;
}
.hero-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(250,247,241,0.85) 0%, rgba(250,247,241,0.0) 50%),
    linear-gradient(180deg, rgba(250,247,241,0.45) 0%, rgba(250,247,241,0) 22%, rgba(250,247,241,0) 65%, rgba(250,247,241,0.75) 100%),
    linear-gradient(90deg, rgba(250,247,241,0.55) 0%, rgba(250,247,241,0.0) 35%, rgba(250,247,241,0.0) 65%, rgba(250,247,241,0.4) 100%);
}

.hero-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex: 1;
  min-height: 100vh;
  max-width: var(--max);
  margin: 0 auto;
  width: 100%;
  padding: clamp(20px, 3vh, 32px) var(--gutter) clamp(24px, 4vh, 56px);
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
}

.hero-logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  transition: transform 0.6s var(--ease-soft);
}
.hero-logo-wrap:hover { transform: translateY(-2px); }

.hero-logo {
  height: 160px;
  width: auto;
  filter: drop-shadow(0 8px 20px rgba(203, 16, 44, 0.18));
  animation: floatGlow 6s ease-in-out infinite;
  margin: -38px 0 -38px -8px;
  display: block;
}

.hero-eyebrow-top {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--red);
  margin-top: 4px;
}

.hero-bottom {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: clamp(32px, 6vw, 80px);
  align-items: end;
  margin-top: auto;
  padding-bottom: 80px;
}

.hero-headline {
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(54px, 8.5vw, 130px);
  line-height: 0.92;
  letter-spacing: -0.025em;
  margin: 0;
  color: var(--ink);
  max-width: 9ch;
}
.hero-headline .h-script {
  font-family: var(--f-script);
  font-style: italic;
  font-weight: 700;
  color: var(--red);
  font-size: 0.95em;
  letter-spacing: -0.03em;
  display: inline-block;
  transform: translateY(0.15em) rotate(-4deg);
  margin-right: 0.05em;
  margin-bottom: -0.2em;
}
.hero-headline em {
  font-style: italic;
  color: var(--red);
  font-weight: 400;
}

.hero-rt-stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: flex-start;
}

.hero-copy {
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  color: rgba(20,18,14,0.78);
  max-width: 36ch;
}

.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 28px;
  background: var(--red);
  color: #fff;
  border: 0;
  border-radius: 999px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.4s var(--ease-bounce), background 0.3s;
  animation: pulseGlow 3s ease-in-out infinite;
}
.hero-cta::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  background-size: 200% 100%;
  animation: shimmer 3s linear infinite;
  pointer-events: none;
}
.hero-cta:hover { transform: translateY(-3px) scale(1.04); background: var(--red-deep); }
.hero-cta-arrow {
  display: inline-block;
  transition: transform 0.4s var(--ease-bounce);
}
.hero-cta:hover .hero-cta-arrow { transform: translateX(6px) rotate(-12deg); }

/* Top sticky nav */
.nav-bar {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(20,18,14,0.08);
  border-radius: 999px;
  z-index: 100;
  box-shadow: 0 12px 40px rgba(20,18,14,0.08);
  transition: top 0.4s var(--ease-soft);
}
.nav-bar a {
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  padding: 10px 16px;
  color: var(--ink);
  border-radius: 999px;
  transition: background 0.2s, color 0.2s;
}
.nav-bar a:hover { background: var(--bg-alt); color: var(--red); }
.nav-cta-btn {
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  background: var(--red);
  color: #fff;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.3s var(--ease-bounce), background 0.2s;
}
.nav-cta-btn:hover { transform: scale(1.05); background: var(--red-deep); }

/* Old nav-pill keep for backwards compat but hide */
.nav-pill { display: none; }

/* ============== ABOUT (orange) - legacy, hidden by override ============== */
.about-legacy-stub {
  display: none;
}

/* Floating nav pill at bottom of hero */
.nav-pill {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: rgba(0,0,0,0.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: 999px;
  z-index: 10;
}

.nav-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background:
    repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,0.1) 4px 5px),
    linear-gradient(180deg, #E0D8C4, #BDB3A0);
  border: 1px solid rgba(0,0,0,0.1);
}

.nav-pill a {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 12px 14px;
  color: var(--black);
  transition: opacity 200ms;
}

.nav-pill a:hover { opacity: 0.6; }

.nav-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  background: var(--white);
  border-radius: 999px;
  border: 1px solid rgba(0,0,0,0.08);
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--black);
  cursor: pointer;
}
.nav-cta::after { content: "+"; font-size: 16px; }

/* ============== ABOUT (orange) ============== */
.about {
  background: var(--orange);
  color: var(--white);
  border-radius: var(--r-lg);
  margin: 18px var(--gutter);
  padding: clamp(60px, 8vw, 120px) clamp(24px, 4vw, 64px);
  position: relative;
  overflow: hidden;
  min-height: 540px;
  display: flex;
  align-items: center;
  background-image:
    radial-gradient(ellipse at 70% 50%, rgba(0,0,0,0.45), transparent 65%);
}

.about-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 75% 55%, rgba(0,0,0,0.55), transparent 60%),
    repeating-linear-gradient(45deg, transparent 0 80px, rgba(255,255,255,0.04) 80px 81px);
  z-index: 0;
}

.about-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(28px, 5vw, 80px);
  align-items: center;
  width: 100%;
}

.about-card {
  background: rgba(0,0,0,0.32);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--r-md);
  padding: 40px clamp(28px, 4vw, 56px);
  display: flex;
  align-items: center;
  gap: clamp(20px, 3vw, 56px);
  background-image: radial-gradient(ellipse at 20% 50%, rgba(232,116,42,0.6), transparent 70%);
}

.about-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--white);
  writing-mode: horizontal-tb;
  white-space: nowrap;
}

.about-title {
  font-family: var(--f-display);
  font-size: clamp(56px, 8vw, 120px);
  line-height: 0.95;
  text-transform: uppercase;
  margin: 0;
  color: var(--white);
}

.about-copy {
  position: relative;
  z-index: 1;
  max-width: 32ch;
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255,255,255,0.85);
  align-self: end;
}

/* ============== SECTION (black bg) ============== */
.section {
  padding: clamp(48px, 6vw, 96px) 0;
  position: relative;
}

.section-card {
  background: var(--ink-card);
  border-radius: var(--r-lg);
  margin: 18px var(--gutter);
  padding: clamp(40px, 5vw, 80px) clamp(28px, 4vw, 64px);
  position: relative;
  overflow: hidden;
}

.section-head-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: end;
  margin-bottom: clamp(40px, 5vw, 72px);
}

.section-title {
  font-family: var(--f-display);
  font-size: clamp(42px, 6vw, 88px);
  line-height: 0.95;
  text-transform: uppercase;
  margin: 0;
  color: var(--white);
}

.section-sub {
  max-width: 36ch;
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255,255,255,0.65);
}

/* ============== TIERS / OFFER CARDS ============== */
.tiers {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
@media (max-width: 1100px) { .tiers { grid-template-columns: repeat(2, 1fr); } }

.tier-card {
  background: var(--card-2);
  border-radius: var(--r-md);
  padding: 32px 26px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
  overflow: hidden;
  min-height: 480px;
  transition: transform 360ms ease;
}

.tier-card::before {
  content: "";
  position: absolute;
  top: -40%;
  right: -20%;
  width: 80%;
  height: 80%;
  background: radial-gradient(ellipse, var(--warm-tint), transparent 65%);
  pointer-events: none;
  opacity: 0.7;
}

.tier-card:hover { transform: translateY(-4px); }

.tier-card.signature::before {
  background: radial-gradient(ellipse, rgba(232,116,42,0.32), transparent 65%);
}

.tier-card.signature {
  border: 1px solid rgba(200,65,44,0.4);
}
.tier-card.flagship {
  border: 1px solid rgba(200,65,44,0.6);
  background: linear-gradient(180deg, rgba(200,65,44,0.08), var(--card-2));
}
.tier-card.flagship::before {
  background: radial-gradient(ellipse, rgba(200,65,44,0.32), transparent 65%);
}
.tier-kind {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  position: relative;
  z-index: 1;
}
.tier-kind.real { color: var(--red); }
.tier-kind.ai { color: #6E9D8C; }

.tier-num {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--orange);
  position: relative;
  z-index: 1;
}

.tier-name {
  font-family: var(--f-display);
  font-size: clamp(28px, 2.6vw, 38px);
  line-height: 1;
  text-transform: uppercase;
  margin: 0;
  position: relative;
  z-index: 1;
}

.tier-desc {
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255,255,255,0.72);
  position: relative;
  z-index: 1;
  flex: 1;
}

.tier-list {
  list-style: none;
  margin: 0;
  padding: 18px 0 0;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.tier-list li {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.78);
  display: grid;
  grid-template-columns: 14px 1fr;
  gap: 8px;
}

.tier-list li::before { content: "+"; color: var(--orange); }

/* Real-wedding (light) section: bigger, more legible bullets */
.section-card-alt .tier-list li {
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: 0;
  text-transform: none;
  color: rgba(20,18,14,0.85);
  align-items: start;
}
.section-card-alt .tier-list li::before {
  content: "•";
  color: var(--orange);
  font-size: 18px;
  line-height: 1.2;
}
.section-card-alt .tier-desc {
  font-size: 14px;
  line-height: 1.55;
  color: rgba(20,18,14,0.7);
}

/* Limited weddings pill */
.limited-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.tier-foot {
  display: flex;
  justify-content: space-between;
  align-items: end;
  position: relative;
  z-index: 1;
}

.tier-price {
  font-family: var(--f-display);
  font-size: 32px;
  text-transform: uppercase;
}
.tier-price-lbl {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-bottom: 6px;
}

/* Buttons */
.btn {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 14px 22px;
  background: var(--white);
  color: var(--black);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: all 240ms ease;
}
.btn:hover { background: var(--orange); color: var(--white); }
.btn::after { content: "→"; }

.btn-orange { background: var(--orange); color: var(--white); }
.btn-orange:hover { background: var(--white); color: var(--black); }

.btn-ghost {
  background: transparent;
  color: var(--white);
  border: 1px solid var(--line-strong);
}
.btn-ghost:hover { background: var(--white); color: var(--black); border-color: var(--white); }

.btn-on-light { background: var(--black); color: var(--white); }
.btn-on-light:hover { background: var(--orange); color: var(--white); }

/* ============== VISION (interactive) ============== */
.vision-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 18px;
}

.vision-panel {
  background: var(--card-2);
  border-radius: var(--r-md);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
  overflow: hidden;
}

.vision-panel::before {
  content: "";
  position: absolute;
  top: -50%; right: -30%;
  width: 90%; height: 90%;
  background: radial-gradient(ellipse, var(--warm-tint), transparent 65%);
  pointer-events: none;
}

.vision-label {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

.upload-zone {
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-sm);
  padding: 24px;
  background: rgba(255,255,255,0.02);
  cursor: pointer;
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 16px;
  align-items: center;
  position: relative;
  z-index: 1;
  transition: all 240ms;
}
.upload-zone:hover { border-color: var(--orange); background: rgba(232,116,42,0.06); }
.upload-zone.is-active { border-color: var(--orange); background: rgba(232,116,42,0.10); border-style: solid; }

.upload-icon {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--orange);
  color: var(--white);
  font-family: var(--f-display);
  font-size: 22px;
}

.upload-main {
  font-family: var(--f-mono);
  font-size: 14px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.upload-sub {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

.thumb-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  position: relative;
  z-index: 1;
}

.thumb {
  aspect-ratio: 1;
  border-radius: var(--r-sm);
  background: rgba(255,255,255,0.04);
  cursor: pointer;
  border: 1px solid var(--line);
  transition: all 200ms;
  position: relative;
  overflow: hidden;
}
.thumb.is-on { border-color: var(--orange); outline: 1px solid var(--orange); outline-offset: -3px; }

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  position: relative;
  z-index: 1;
}
.chip {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  cursor: pointer;
  color: var(--white);
  transition: all 200ms;
}
.chip:hover { border-color: var(--orange); }
.chip.is-on { background: var(--orange); border-color: var(--orange); }

/* Preview pane */
.preview {
  background: var(--card-2);
  border-radius: var(--r-md);
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 520px;
  position: relative;
}

.preview-head, .preview-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}
.preview-head { border-bottom: 1px solid var(--line); }
.preview-foot { border-top: 1px solid var(--line); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); display: inline-block; margin-right: 8px; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

.compare-stage {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.compare-side { position: absolute; inset: 0; background-size: cover; background-position: center; }
.compare-before {
  background:
    repeating-linear-gradient(135deg, transparent 0 22px, rgba(255,255,255,0.05) 22px 23px),
    linear-gradient(180deg, #1a1814, #0f0d0b);
}
.compare-after {
  clip-path: inset(0 0 0 var(--split, 50%));
  background:
    radial-gradient(ellipse at 30% 30%, rgba(232,116,42,0.32), transparent 60%),
    repeating-linear-gradient(45deg, transparent 0 28px, rgba(232,116,42,0.10) 28px 29px),
    linear-gradient(180deg, #2a1a0d, #0f0d0b);
}
.compare-tag {
  position: absolute;
  top: 16px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  color: var(--white);
}
.compare-tag.before { left: 16px; }
.compare-tag.after { right: 16px; background: var(--orange); color: var(--white); }
.compare-handle {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--orange);
  left: var(--split, 50%);
  pointer-events: none;
}
.compare-handle::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 0 6px rgba(232,116,42,0.18);
}
.compare-handle::after {
  content: "‹›";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-family: var(--f-mono);
  font-size: 16px;
  letter-spacing: 4px;
  color: var(--white);
}
.compare-grab { position: absolute; inset: 0; cursor: ew-resize; }

.gen-overlay {
  position: absolute; inset: 0;
  background: rgba(14,13,12,0.85);
  backdrop-filter: blur(10px);
  display: grid; place-items: center;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms;
}
.gen-overlay.is-on { opacity: 1; pointer-events: auto; }
.gen-spinner {
  width: 32px; height: 32px;
  border: 1px solid var(--line-strong);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 1.4s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gen-text {
  font-family: var(--f-mono);
  font-size: 14px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;
}
.gen-sub {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin-top: 8px;
}

.preview-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  padding: 24px;
}

/* ============== GALLERY ============== */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}
.gal-card {
  aspect-ratio: 1/1;
  border-radius: var(--r-md);
  background: var(--card-2);
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  background-size: cover;
  background-position: center;
}
.gal-1 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)), repeating-linear-gradient(45deg, #4a1410 0 12px, #6e2620 12px 13px); }
.gal-2 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)), repeating-linear-gradient(135deg, #0d3a30 0 12px, #1a5a48 12px 13px); }
.gal-3 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)), repeating-linear-gradient(45deg, #6b3a14 0 12px, #8e5524 12px 13px); }
.gal-4 { background-image: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)), repeating-linear-gradient(135deg, #1a1a1a 0 12px, #2a2a2a 12px 13px); }

.gal-glass {
  background: rgba(0,0,0,0.32);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-radius: var(--r-md);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 32px 40px;
  text-align: center;
  background-image: radial-gradient(ellipse at 50% 50%, rgba(232,116,42,0.22), transparent 70%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
.gal-eyebrow {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
}
.gal-title {
  font-family: var(--f-display);
  font-size: clamp(24px, 2.4vw, 36px);
  text-transform: uppercase;
  margin: 0;
}

/* ============== STATS / MILESTONES ============== */
.stats-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
  margin-top: 18px;
}

.stats-card {
  background: var(--card-2);
  border-radius: var(--r-md);
  padding: clamp(40px, 4vw, 64px);
  position: relative;
  overflow: hidden;
  min-height: 380px;
  display: flex;
  flex-direction: column;
}

.stats-card.previews {
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 24px;
}

.stack-imgs {
  position: relative;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stack-img {
  position: absolute;
  width: 110px;
  height: 170px;
  border-radius: 12px;
  background-size: cover;
  background-position: center;
  border: 1px solid var(--line);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}
.stack-img.s1 { transform: rotate(-14deg) translateX(-150px); background: linear-gradient(180deg, #efe3d3, #c9b594); }
.stack-img.s2 { transform: rotate(-6deg) translateX(-60px); background: linear-gradient(180deg, #2a1810, #50301a); }
.stack-img.s3 { transform: rotate(2deg) translateX(40px); background: linear-gradient(180deg, #6e2620, #4a1410); }
.stack-img.s4 { transform: rotate(10deg) translateX(140px); background: linear-gradient(180deg, #0d3a30, #1a5a48); }

.stat-big {
  font-family: var(--f-display);
  font-size: clamp(80px, 9vw, 140px);
  line-height: 0.85;
  text-transform: uppercase;
}
.stat-big .plus { color: var(--muted); }

.stat-lbl {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin-top: 8px;
}

.stats-card.milestones {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 12px;
}
.milestones-eyebrow {
  font-family: var(--f-mono);
  font-size: 14px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.milestones-divider {
  width: 60%;
  height: 1px;
  background: var(--line);
  margin: 24px 0;
}

/* ============== CONTACT ============== */
.contact-card {
  background: var(--ink-card);
  border-radius: var(--r-lg);
  margin: 18px var(--gutter);
  padding: clamp(40px, 5vw, 80px) clamp(28px, 4vw, 64px);
  background-image:
    radial-gradient(ellipse at 75% 40%, rgba(232,116,42,0.28), transparent 55%),
    radial-gradient(ellipse at 30% 80%, rgba(110,40,16,0.4), transparent 55%);
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: clamp(28px, 5vw, 80px);
  align-items: center;
}

.contact-title {
  font-family: var(--f-display);
  font-size: clamp(56px, 7vw, 112px);
  line-height: 0.95;
  text-transform: uppercase;
  margin: 0 0 24px;
}

.form-card {
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-md);
  padding: clamp(28px, 3vw, 44px);
  display: flex;
  flex-direction: column;
  gap: 18px;
  background-image: radial-gradient(ellipse at 80% 30%, rgba(232,116,42,0.20), transparent 60%);
}

.form-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-align: center;
  color: rgba(255,255,255,0.85);
  margin-bottom: 8px;
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-field label {
  font-family: var(--f-ui);
  font-size: 12px;
  color: rgba(255,255,255,0.85);
}

.form-field input,
.form-field select,
.form-field textarea {
  background: rgba(0,0,0,0.48);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  font-family: var(--f-ui);
  font-size: 14px;
  color: var(--white);
  outline: 0;
  transition: border-color 200ms;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus { border-color: var(--orange); }

.form-field input::placeholder,
.form-field textarea::placeholder { color: rgba(255,255,255,0.35); }

.tier-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tier-opt {
  flex: 1 1 30%;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 12px 10px;
  border-radius: var(--r-sm);
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.10);
  color: var(--white);
  cursor: pointer;
  text-align: center;
  transition: all 200ms;
}
.tier-opt:hover { border-color: var(--orange); }
.tier-opt.is-on { background: var(--orange); border-color: var(--orange); }

.form-submit {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 18px;
  border-radius: 999px;
  background: var(--white);
  color: var(--black);
  border: 0;
  cursor: pointer;
  transition: all 200ms;
}
.form-submit:hover { background: var(--orange); color: var(--white); }

.form-success {
  text-align: center;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
.form-success h3 {
  font-family: var(--f-display);
  font-size: 28px;
  text-transform: uppercase;
  margin: 0;
}

/* ============== FOOTER ============== */
.footer {
  background: var(--ink-card);
  border-radius: var(--r-lg);
  margin: 18px var(--gutter);
  padding: clamp(48px, 5vw, 80px) clamp(28px, 4vw, 64px);
}

.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 40px;
  margin-bottom: 56px;
}

.footer-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}

.footer-mark {
  font-family: var(--f-display);
  font-size: clamp(24px, 3vw, 36px);
  text-transform: uppercase;
  word-break: break-all;
  line-height: 1.1;
  margin-bottom: 24px;
}

.footer-copy {
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  max-width: 36ch;
  line-height: 1.6;
  margin-bottom: 28px;
}

.footer-credit {
  font-family: var(--f-ui);
  font-size: 12px;
  color: var(--muted);
}

.footer-col h5 {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 18px;
}

.footer-col ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.footer-col li {
  font-family: var(--f-mono);
  font-size: 16px;
  text-transform: capitalize;
}

.footer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
  padding-top: 28px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}

.brand-mega {
  font-family: var(--f-display);
  font-size: clamp(60px, 14vw, 220px);
  text-transform: uppercase;
  text-align: center;
  line-height: 0.9;
  margin: 40px 0 0;
}

/* ============== Section eyebrow + tiers-2 + alt section ============== */
.section-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 18px;
}

.section-card-alt {
  background: var(--ivory);
  color: var(--ink);
}

.section-card-alt .section-title { color: var(--ink); }
.section-card-alt .section-title em { color: var(--orange); font-style: italic; }
.section-card-alt .section-sub { color: rgba(20,18,14,0.7); }
.section-card-alt .section-eyebrow { color: var(--orange); }

.section-card-alt .tier-card {
  background: #fff;
  color: var(--ink);
  border: 1px solid rgba(20,18,14,0.08);
}
.section-card-alt .tier-card .tier-name { color: var(--ink); }
.section-card-alt .tier-card .tier-desc { color: rgba(20,18,14,0.7); }
.section-card-alt .tier-card .tier-list li { color: rgba(20,18,14,0.78); border-color: rgba(20,18,14,0.08); }
.section-card-alt .tier-card .tier-num { color: rgba(20,18,14,0.4); }
.section-card-alt .tier-card .tier-price { color: var(--ink); }
.section-card-alt .tier-card .tier-price-lbl { color: rgba(20,18,14,0.5); }
.section-card-alt .tier-foot { border-top-color: rgba(20,18,14,0.1); }
.section-card-alt .btn { background: var(--ink); color: #fff; }
.section-card-alt .btn:hover { background: var(--orange); }

.tiers-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* ============== Questionnaire Modal ============== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10,9,8,0.78);
  backdrop-filter: blur(18px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: modalFade 0.3s ease;
}

@keyframes modalFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-shell {
  width: 100%;
  max-width: 920px;
  max-height: 90vh;
  background: var(--ivory);
  color: var(--ink);
  border-radius: 28px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 320px 1fr;
  position: relative;
  animation: modalSlide 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
}

@keyframes modalSlide {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-shell.real {
  background: var(--ink);
  color: #fff;
}

.modal-aside {
  background: var(--orange);
  color: #fff;
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}

.modal-shell.real .modal-aside {
  background: var(--ink);
  border-right: 1px solid rgba(255,255,255,0.08);
}

.modal-aside-eyebrow {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 24px;
}

.modal-aside-title {
  font-family: var(--f-display);
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.modal-aside-title em { font-style: italic; font-weight: 400; }

.modal-aside-meta {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  line-height: 1.6;
  opacity: 0.85;
}
.modal-aside-meta div { padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.2); }
.modal-aside-meta div:first-child { border-top: 0; }

.modal-body {
  padding: 32px 36px;
  overflow-y: auto;
  max-height: 90vh;
}

.modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  background: rgba(20,18,14,0.06);
  border: 0;
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-shell.real .modal-close {
  background: rgba(255,255,255,0.08);
  color: #fff;
}
.modal-close:hover { background: var(--orange); color: #fff; }

.modal-step {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--orange);
  margin-bottom: 12px;
}

.modal-progress {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
}
.modal-progress span {
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: rgba(20,18,14,0.1);
}
.modal-shell.real .modal-progress span { background: rgba(255,255,255,0.12); }
.modal-progress span.active { background: var(--orange); }

.modal-q {
  font-family: var(--f-display);
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin-bottom: 10px;
  font-weight: 700;
}
.modal-q em { font-style: italic; font-weight: 700; color: var(--orange); }

.modal-q-sub {
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
  margin-bottom: 22px;
  max-width: 50ch;
}
.modal-shell.real .modal-q-sub { color: rgba(255,255,255,0.75); }

.modal-input,
.modal-textarea,
.modal-select {
  width: 100%;
  background: #fff;
  border: 1px solid rgba(20,18,14,0.12);
  border-radius: 14px;
  padding: 14px 16px;
  font-family: var(--f-body);
  font-size: 15px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.modal-shell.real .modal-input,
.modal-shell.real .modal-textarea,
.modal-shell.real .modal-select {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  color: #fff;
}
.modal-input:focus,
.modal-textarea:focus,
.modal-select:focus { border-color: var(--orange); }

.modal-textarea { min-height: 110px; resize: vertical; }

.modal-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.modal-field > label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted, #6E6557);
  font-weight: 700;
  display: block;
}
.modal-shell.real .modal-field > label { color: rgba(255,255,255,0.7); }
.modal-field .modal-input { margin-bottom: 0; }
.modal-field .modal-pills { margin-top: 0; }
.modal-select {
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1l5 5 5-5' stroke='%2314120E' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 16px center;
  padding-right: 38px;
  cursor: pointer;
}
.modal-shell.real .modal-select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1l5 5 5-5' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
}

.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.modal-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.modal-pill {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 16px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid rgba(20,18,14,0.12);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.18s;
}
.modal-shell.real .modal-pill {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.14);
  color: #fff;
}
.modal-pill:hover { border-color: var(--orange); }
.modal-pill.on { background: var(--orange); border-color: var(--orange); color: #fff; }

.modal-options {
  display: grid;
  gap: 10px;
}
.modal-option {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px;
  background: #fff;
  border: 1px solid rgba(20,18,14,0.12);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.18s;
}
.modal-shell.real .modal-option {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.14);
}
.modal-option:hover { border-color: var(--orange); }
.modal-option.on { border-color: var(--orange); background: rgba(232,116,42,0.08); }
.modal-option .modal-option-num {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--orange);
  min-width: 32px;
}
.modal-option .modal-option-body { flex: 1; }
.modal-option .modal-option-title {
  font-family: var(--f-display);
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.modal-option .modal-option-sub {
  font-size: 13px;
  opacity: 0.7;
  line-height: 1.4;
}

.modal-upload {
  border: 2px dashed rgba(20,18,14,0.18);
  border-radius: 16px;
  padding: 28px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #fff;
}
.modal-shell.real .modal-upload {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.18);
}
.modal-upload:hover { border-color: var(--orange); background: rgba(232,116,42,0.05); }
.modal-upload-icon {
  font-family: var(--f-display);
  font-size: 28px;
  color: var(--orange);
  margin-bottom: 8px;
}
.modal-upload-label {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.modal-upload-sub {
  font-size: 12px;
  opacity: 0.6;
  margin-top: 6px;
}

.modal-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid rgba(20,18,14,0.08);
}
.modal-shell.real .modal-foot { border-top-color: rgba(255,255,255,0.1); }

.modal-back {
  background: none;
  border: 0;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: inherit;
  opacity: 0.6;
  cursor: pointer;
}
.modal-back:hover { opacity: 1; color: var(--orange); }
.modal-back:disabled { visibility: hidden; }

.modal-next {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--orange);
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 14px 28px;
  cursor: pointer;
  transition: all 0.2s;
}
.modal-next:hover { background: var(--ink); }
.modal-shell.real .modal-next:hover { background: #fff; color: var(--ink); }
.modal-next:disabled { opacity: 0.4; cursor: not-allowed; }

.modal-thanks {
  text-align: center;
  padding: 40px 20px;
}
.modal-thanks-icon {
  font-family: var(--f-display);
  font-size: 48px;
  color: var(--orange);
  margin-bottom: 16px;
}
.modal-thanks h3 {
  font-family: var(--f-display);
  font-size: 32px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.modal-thanks p {
  font-size: 15px;
  opacity: 0.7;
  max-width: 40ch;
  margin: 0 auto;
  line-height: 1.5;
}

/* ============== Responsive ============== */
@media (max-width: 960px) {
  .hero { background-position: 60% top; min-height: 90vh; }
  .hero-inner { grid-template-columns: 1fr; min-height: auto; padding: 32px var(--gutter) 80px; gap: 16px; }
  .hero-left { padding-bottom: 0; }
  .hero-image, .hero-center, .hero-right { display: none; }
  .hero-title { background: rgba(255,255,255,0.7); padding: 8px 12px; backdrop-filter: blur(8px); display: inline-block; }
  .nav-pill { flex-wrap: wrap; max-width: 92%; justify-content: center; }
  .nav-pill a { padding: 10px 8px; font-size: 10px; }
  .tiers-2 { grid-template-columns: 1fr; }

  /* Modal: stack vertical, full height, scrollable body */
  .modal-backdrop { padding: 12px; }
  .modal-shell {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    max-height: 96vh;
    height: 96vh;
    border-radius: 18px;
    overflow: hidden;
  }
  .modal-aside {
    grid-row: 1;
    padding: 14px 22px;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .modal-aside-eyebrow { font-size: 9px; margin-bottom: 0; opacity: 0.85; flex-shrink: 0; }
  .modal-aside-title { font-size: 18px; margin-bottom: 0; line-height: 1.1; flex: 1; min-width: 60%; }
  .modal-aside-meta { display: none; }
  .modal-body {
    grid-row: 2;
    padding: 20px 20px 28px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    max-height: none !important;
  }
  .modal-q { font-size: 22px; line-height: 1.1; margin-bottom: 8px; }
  .modal-q-sub { font-size: 13px; margin-bottom: 18px; }
  .modal-foot { margin-top: 22px; padding-top: 16px; padding-bottom: 8px; }
  .modal-input, .modal-textarea, .modal-select { padding: 12px 14px !important; font-size: 14px !important; border-radius: 10px !important; }
  .modal-field > label { font-size: 10px !important; letter-spacing: 0.14em; }
  .modal-grid { grid-template-columns: 1fr; gap: 10px; }
  .modal-pills { gap: 6px; }
  .modal-pill { font-size: 11px !important; padding: 8px 12px !important; }
  .modal-options { gap: 8px; }
  .modal-option { padding: 12px !important; }
  .modal-option-num { font-size: 11px !important; }
  .modal-option-title { font-size: 14px !important; }
  .modal-option-sub { font-size: 12px !important; }
  .modal-upload { padding: 24px 16px !important; }
  .modal-upload-label { font-size: 13px !important; }
  .modal-upload-sub { font-size: 11px !important; }
  .modal-back, .modal-next { padding: 11px 18px !important; font-size: 11px !important; }

  .about-inner { grid-template-columns: 1fr; }
  .about-card { flex-direction: column; align-items: flex-start; padding: 28px; gap: 12px; }
  .about-eyebrow { writing-mode: horizontal-tb; }
  .tiers { grid-template-columns: 1fr; }
  .vision-grid { grid-template-columns: 1fr; }
  .gallery-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr; }
  .contact-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; }
  .section-head-row { grid-template-columns: 1fr; }
}

.hero-title em, .section-title em, .contact-title em, .gal-title em, .about-title em {
  font-style: italic;
  font-weight: 300;
}
.hero-copy em, .section-sub em, .footer-copy em, .about-copy em { font-style: italic; }
.hero-title { font-weight: 300; letter-spacing: -0.02em; }
.section-title, .contact-title, .about-title, .tier-name { font-weight: 300; letter-spacing: -0.015em; text-transform: none; }
.brand-mega { font-weight: 300; letter-spacing: -0.02em; text-transform: none; font-style: italic; }
.gal-title, .stat-big, .form-success h3 { font-weight: 400; text-transform: none; letter-spacing: -0.01em; }
.tier-name { line-height: 1.05; }

/* ============================================================
   LIGHT THEME OVERRIDES — flip dark cards to ivory/white
   ============================================================ */
body { background: var(--bg); color: var(--ink); }

.section-card {
  background: var(--bg-card) !important;
  color: var(--ink) !important;
  border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(20,18,14,0.06);
}
.section-card .section-title,
.section-card .contact-title,
.section-card .gal-title { color: var(--ink) !important; }
.section-card .section-title em,
.section-card .gal-title em { color: var(--red); font-style: italic; }
.section-card .section-sub,
.section-card .gal-sub { color: rgba(20,18,14,0.65) !important; }
.section-card .section-eyebrow,
.section-card .eyebrow { color: var(--red) !important; }

.tier-card {
  background: #fff !important;
  color: var(--ink) !important;
  border: 1px solid rgba(20,18,14,0.08) !important;
  transition: transform 0.5s var(--ease-bounce), box-shadow 0.5s var(--ease-soft), border-color 0.3s !important;
}
.tier-card:hover {
  transform: translateY(-8px) !important;
  box-shadow: 0 30px 60px rgba(203, 16, 44, 0.18) !important;
  border-color: rgba(203, 16, 44, 0.3) !important;
}
.tier-card .tier-name { color: var(--ink) !important; }
.tier-card .tier-desc { color: rgba(20,18,14,0.65) !important; }
.tier-card .tier-list li {
  color: rgba(20,18,14,0.78) !important;
  border-color: rgba(20,18,14,0.08) !important;
}
.tier-card .tier-list li::before { color: var(--red) !important; }
.tier-card .tier-num { color: rgba(20,18,14,0.4) !important; }
.tier-card .tier-price { color: var(--red) !important; font-weight: 400; }
.tier-card .tier-price-lbl { color: rgba(20,18,14,0.5) !important; }
.tier-foot { border-top-color: rgba(20,18,14,0.1) !important; }

/* Stats cards */
.stats-card {
  background: #fff !important;
  color: var(--ink) !important;
  border: 1px solid rgba(20,18,14,0.08);
  box-shadow: 0 20px 50px rgba(20,18,14,0.05);
  transition: transform 0.5s var(--ease-bounce), box-shadow 0.5s;
}
.stats-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 30px 70px rgba(203, 16, 44, 0.12);
}

/* Buttons — global hover with magnetic feel */
.btn {
  background: var(--red) !important;
  color: #fff !important;
  border-radius: 999px !important;
  border: 0 !important;
  transition: transform 0.4s var(--ease-bounce), background 0.3s, box-shadow 0.3s !important;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  background-size: 200% 100%;
  transform: translateX(-100%);
  transition: transform 0.6s var(--ease-soft);
  pointer-events: none;
}
.btn:hover {
  background: var(--red-deep) !important;
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 16px 40px rgba(203, 16, 44, 0.35);
}
.btn:hover::before { transform: translateX(100%); }

/* About panel — flip from solid red to soft ivory card with red accents */
.about {
  background: var(--bg-alt) !important;
  color: var(--ink) !important;
  border: 1px solid rgba(20,18,14,0.06);
}
.about-card {
  background: rgba(255,255,255,0.6) !important;
  border: 1px solid rgba(20,18,14,0.08) !important;
  backdrop-filter: blur(20px);
}
.about-title { color: var(--ink) !important; }
.about-title em { color: var(--red); font-style: italic; }
.about-copy { color: rgba(20,18,14,0.78) !important; }

/* Gallery cards */
.gal-card {
  border: 1px solid var(--line);
  transition: transform 0.6s var(--ease-soft), box-shadow 0.6s !important;
  overflow: hidden;
}
.gal-card:hover {
  transform: scale(1.02) translateY(-4px);
  box-shadow: 0 30px 60px rgba(20,18,14,0.18);
}
.gal-card img, .gal-card .gal-bg {
  transition: transform 1.2s var(--ease-soft);
}
.gal-card:hover img, .gal-card:hover .gal-bg {
  transform: scale(1.08);
}

/* Footer fix for light theme */
.footer { background: var(--ink) !important; color: var(--ivory) !important; }
.footer * { color: inherit; }

/* Section padding & rhythm — soft alt backgrounds */
.section { background: var(--bg); }
.section.section-alt { background: var(--bg-alt); }

/* ============================================================
   WHY THE BRIDAL CIRCLE EXISTS
   ============================================================ */
.why-section {
  padding: clamp(80px, 10vw, 140px) var(--gutter);
  background: var(--bg);
}
.why-grid {
  max-width: var(--max);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: clamp(40px, 6vw, 96px);
  align-items: start;
}
.why-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 24px;
  display: block;
}
.why-title {
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(48px, 6vw, 92px);
  line-height: 0.95;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0 0 0 0;
}
.why-title em { font-style: italic; color: var(--red); }
.why-body p {
  font-size: 17px;
  line-height: 1.65;
  color: rgba(20,18,14,0.78);
  margin: 0 0 18px;
}
.why-body p strong { color: var(--ink); font-weight: 500; }
.why-cards {
  max-width: var(--max);
  margin: 56px auto 0;
  background: var(--bg-alt);
  border-radius: var(--r-lg);
  padding: clamp(28px, 4vw, 48px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.why-card {
  background: #fff;
  border-radius: var(--r-md);
  padding: 26px 30px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  border: 1px solid rgba(20,18,14,0.06);
  font-size: 15px;
  line-height: 1.5;
  color: rgba(20,18,14,0.82);
  transition: transform 0.5s var(--ease-bounce), box-shadow 0.5s, border-color 0.3s;
}
.why-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 50px rgba(203, 16, 44, 0.12);
  border-color: rgba(203, 16, 44, 0.25);
}
.why-card::before {
  content: "";
  flex: 0 0 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  margin-top: 7px;
  box-shadow: 0 0 0 4px rgba(203, 16, 44, 0.12);
}

@media (max-width: 860px) {
  .why-grid { grid-template-columns: 1fr; }
  .why-cards { grid-template-columns: 1fr; }
}

/* ============================================================
   JOIN THE BRIDAL CIRCLE
   ============================================================ */
.join-section {
  padding: clamp(60px, 8vw, 120px) var(--gutter);
  background: var(--bg);
}
.join-card {
  max-width: 1080px;
  margin: 0 auto;
  background: #fff;
  border: 1px solid rgba(20,18,14,0.08);
  border-radius: var(--r-lg);
  padding: clamp(48px, 7vw, 96px) clamp(28px, 5vw, 80px);
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 40px 100px rgba(20,18,14,0.06);
}
.join-card::before {
  content: "";
  position: absolute;
  inset: -50%;
  background: radial-gradient(circle at 50% 0%, rgba(203, 16, 44, 0.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.join-card > * { position: relative; z-index: 1; }
.join-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 18px;
}
.join-title {
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(40px, 5.5vw, 76px);
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 0 0 24px;
}
.join-title em { font-style: italic; color: var(--red); }
.join-sub {
  max-width: 60ch;
  margin: 0 auto 36px;
  font-size: 16px;
  line-height: 1.6;
  color: rgba(20,18,14,0.7);
}
.join-perks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  max-width: 720px;
  margin: 0 auto 36px;
}
.join-perk {
  background: var(--bg-alt);
  border-radius: 999px;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  color: rgba(20,18,14,0.8);
  transition: transform 0.4s var(--ease-bounce), background 0.3s;
}
.join-perk:hover { transform: scale(1.03); background: rgba(203, 16, 44, 0.08); }
.join-perk::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 4px rgba(203, 16, 44, 0.15);
  flex: 0 0 8px;
}
.join-cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 18px 36px;
  background: var(--red);
  color: #fff;
  border-radius: 999px;
  border: 0;
  font-family: var(--f-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 0.4s var(--ease-bounce), background 0.3s, box-shadow 0.4s;
  position: relative;
  overflow: hidden;
}
.join-cta:hover {
  transform: translateY(-3px) scale(1.04);
  background: var(--red-deep);
  box-shadow: 0 20px 50px rgba(203, 16, 44, 0.4);
}
.join-cta::after {
  content: "→";
  display: inline-block;
  transition: transform 0.4s var(--ease-bounce);
}
.join-cta:hover::after { transform: translateX(6px) rotate(-12deg); }

@media (max-width: 720px) {
  .join-perks { grid-template-columns: 1fr; }
}

/* ============================================================
   GLOBAL HOVER & MOTION FLAIR
   ============================================================ */
.section-eyebrow {
  position: relative;
  display: inline-block;
}
.section-title { transition: letter-spacing 0.6s var(--ease-soft); }
.reveal.is-visible .section-title { animation: titleSweep 1.2s var(--ease-soft) both; }
@keyframes titleSweep {
  from { letter-spacing: 0.06em; opacity: 0; transform: translateY(20px); }
  to { letter-spacing: -0.015em; opacity: 1; transform: translateY(0); }
}

/* Rotating accent dot used in margins */
.spin-accent {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px dashed var(--red);
  animation: spinSlow 8s linear infinite;
  vertical-align: middle;
}

/* Smooth reveal on contact form */
.contact-card {

/* ==========================================================
   BRIDAL PREVIEWS — rotating fan animation
   ========================================================== */
.stack-imgs.rotating {
  perspective: 1200px;
  height: 360px;
  position: relative;
}
.stack-imgs.rotating .rot-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  animation: rotFan 22s linear infinite;
}
@keyframes rotFan {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}
.stack-imgs.rotating .rot-card {
  position: absolute;
  width: 160px;
  height: 230px;
  border-radius: 18px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  backface-visibility: visible;
  background-size: cover;
  background-position: center;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
}
.stack-imgs.rotating .rot-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.45));
}

/* ==========================================================

   ========================================================== */
.reel-row {
  display: flex;
  gap: 18px;
  overflow: hidden;
  padding: 8px 0 12px;
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.reel-track {
  display: flex;
  gap: 18px;
  animation: reelMarq 40s linear infinite;
  width: max-content;
}
.reel-row:hover .reel-track { animation-play-state: paused; }
@keyframes reelMarq {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.reel-card {
  flex: 0 0 240px;
  aspect-ratio: 9 / 16;
  border-radius: 24px;

}
@media (max-width: 1000px) {

}
.atelier-reel { position: relative; }
.reel-card.reel-card-large {
  flex: 0 0 auto;
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 28px;
  margin: 0;
  border: 1px solid rgba(255,255,255,0.06);
}
.reel-card.reel-card-large .reel-title { font-size: 22px; }
.reel-card.reel-card-large .reel-sub { font-size: 11px; }

.ba-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-content: start;
}
@media (max-width: 700px) {
  .ba-grid { grid-template-columns: 1fr; }
}

.ba-card {
  background: #f3f1ec;
  border-radius: 22px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(20,18,14,0.06);
}
.ba-stage {
  position: relative;
  aspect-ratio: 4 / 5;
  background: linear-gradient(135deg, #efe6d4, #d6c3a4);
  cursor: ew-resize;
  user-select: none;
  overflow: hidden;
}
.ba-side {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.ba-after {
  clip-path: polygon(var(--split, 50%) 0, 100% 0, 100% 100%, var(--split, 50%) 100%);
  background-color: #2a1810;
}
.ba-empty {
  position: absolute;
  top: 16px;
  bottom: 16px;
  left: 16px;
  right: calc(50% + 4px);
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(8px);
  border: 1px dashed rgba(20,18,14,0.25);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-family: "Helvetica Neue","Helvetica","Arial",sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: rgba(20,18,14,0.78);
  cursor: pointer;
  transition: background 0.2s;
  padding: 10px;
  text-align: center;
  overflow: hidden;
}
.ba-empty:hover { background: rgba(255,255,255,0.65); }
.ba-empty.ba-empty-after {
  left: calc(50% + 4px);
  right: 16px;
  background: rgba(10,10,10,0.65);
  color: rgba(255,255,255,0.9);
  border-color: rgba(255,255,255,0.3);
}
.ba-empty.ba-empty-after:hover { background: rgba(10,10,10,0.78); }
.ba-empty-plus {
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  margin-bottom: 2px;
}
.ba-empty-sub {
  font-size: 11px;
  color: rgba(20,18,14,0.5);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ba-empty.ba-empty-after .ba-empty-sub { color: rgba(255,255,255,0.6); }
.ba-tag {
  position: absolute;
  top: 14px;
  padding: 6px 12px;
  border-radius: 999px;
  font-family: "Helvetica Neue","Helvetica","Arial",sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  backdrop-filter: blur(8px);
}
.ba-tag-before {
  left: 14px;
  background: rgba(255,255,255,0.78);
  color: #0a0a0a;
}
.ba-tag-after {
  right: 14px;
  background: rgba(10,10,10,0.65);
  color: #fff;
}
.ba-handle {
  position: absolute;
  top: 0; bottom: 0;
  left: var(--split, 50%);
  width: 2px;
  background: #fff;
  transform: translateX(-1px);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 6px 20px rgba(0,0,0,0.25);
  pointer-events: none;
}
.ba-handle::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #fff;
  transform: translate(-50%, -50%);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.ba-handle-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-family: "Helvetica Neue", sans-serif;
  font-size: 18px;
  font-weight: 600;
  color: #0a0a0a;
  z-index: 2;
}
.ba-handle-l { left: -16px; }
.ba-handle-r { right: -16px; }

.ba-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #fff;
  gap: 10px;
  flex-wrap: wrap;
}
.ba-foot-num {
  font-family: "Helvetica Neue","Helvetica","Arial",sans-serif;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(20,18,14,0.5);
}
.ba-foot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ba-foot-btn {
  font-family: "Helvetica Neue","Helvetica","Arial",sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 999px;
  background: #f3f1ec;
  border: 1px solid rgba(20,18,14,0.08);
  color: #0a0a0a;
  cursor: pointer;
  transition: background 0.2s;
}

  transition: filter 0.3s var(--ease-soft);
}
.ba-stage-preview:hover { filter: brightness(1.04); }

/* 9:16 preview cards — vertical, brides' names in footer */
.ba-card-9x16 {
  opacity: 0;
  transform: translateY(28px) scale(0.97);
  animation: baCardIn 0.9s var(--ease-soft) forwards;
  transition: transform 0.4s var(--ease-soft), box-shadow 0.4s var(--ease-soft);
}
.ba-card-9x16:hover {
  transform: translateY(-4px) scale(1.01);
  box-shadow: 0 22px 48px rgba(20,18,14,0.14);
}
@keyframes baCardIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.ba-stage-9x16 {
  aspect-ratio: 9 / 16 !important;
}
.ba-stage-9x16::after {
  /* subtle ambient sheen that pulses to invite tap */
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.18) 50%, transparent 65%);
  pointer-events: none;
  opacity: 0;
  animation: baSheen 5.5s ease-in-out infinite;
  animation-delay: 1.6s;
}
@keyframes baSheen {
  0%, 100% { opacity: 0; transform: translateX(-30%); }
  45%      { opacity: 0.6; transform: translateX(30%); }
  60%      { opacity: 0; transform: translateX(60%); }
}
.ba-stage-9x16 .ba-handle::before {
  animation: baHandlePulse 2.4s ease-in-out infinite;
}
@keyframes baHandlePulse {
  0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 0 0 rgba(255,255,255,0.5); }
  50%      { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 0 14px rgba(255,255,255,0); }
}
.ba-foot-9x16 {
  padding: 12px 14px !important;
  align-items: baseline !important;

/* ============================================================
   COMPREHENSIVE RESPONSIVE — phone / tablet / laptop / desktop
   ============================================================ */

/* Top nav becomes a horizontal scroll strip on narrower screens
   so it never wraps awkwardly and the CTA stays visible */
@media (max-width: 1100px) {
  .nav-bar {
    gap: 4px !important;
    padding: 6px 10px !important;
    max-width: calc(100vw - 24px) !important;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .nav-bar::-webkit-scrollbar { display: none; }
  .nav-bar a { font-size: 12px !important; padding: 8px 10px !important; flex: 0 0 auto; white-space: nowrap; }
  .nav-cta-btn { font-size: 12px !important; padding: 10px 16px !important; flex: 0 0 auto; white-space: nowrap; }
}
@media (max-width: 700px) {
  .nav-bar { top: 10px !important; padding: 5px 8px !important; }
  .nav-bar a { font-size: 11px !important; padding: 7px 8px !important; }
  .nav-cta-btn { font-size: 11px !important; padding: 9px 14px !important; }
}

/* Tier grids */

  .tv-grid, .tiers, .tiers-2 { grid-template-columns: 1fr 1fr !important; }
}
@media (max-width: 720px) {
  .tv-grid, .tiers, .tiers-2 { grid-template-columns: 1fr !important; }
}

/* Why section reel + text */

  .why-reel-card { max-width: 420px; margin: 0 auto; aspect-ratio: 4 / 5; }
  .why-cards { grid-template-columns: 1fr 1fr !important; }
}
@media (max-width: 600px) {
  .why-cards { grid-template-columns: 1fr !important; }
  .why-title { font-size: clamp(40px, 11vw, 60px) !important; }

/* Vision (Try your wedding) */

  .vision-panel { padding: 24px !important; }

/* Before/After preview grid */
@media (max-width: 1100px) { .ba-grid-only { grid-template-columns: 1fr 1fr !important; gap: 14px !important; } }
@media (max-width: 420px)  { .ba-grid-only { grid-template-columns: 1fr !important; } }

/* Stats row */

  .stats-row { grid-template-columns: 1fr !important; gap: 20px !important; }
}

/* Contact: stack left + form on tablet/phone */

/* Footer / Get in touch */

  .footer.v2 .f-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .footer.v2 .f-nav li { font-size: 20px !important; }
  .f-logo-text { font-size: clamp(60px, 14vw, 120px) !important; }

/* Join card */

  .join-card { padding: 56px 24px !important; }
  .join-perks { grid-template-columns: 1fr !important; }
  .join-title { font-size: clamp(36px, 9vw, 56px) !important; }

/* Hero copy */

  .hero-copy { font-size: 14px !important; }

}

/* Universal: ensure inputs don't zoom on iOS */

  input, textarea, select {
    font-size: 16px !important;
  }
}

/* Marquee / band defenses — never let anything overflow */
html, body { overflow-x: hidden; }
img, video, iframe { max-width: 100%; }
