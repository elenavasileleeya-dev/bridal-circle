  border-radius: var(--r-lg);
  margin: 18px var(--gutter);
  padding: clamp(40px, 5vw, 72px) clamp(28px, 4vw, 64px);
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.yt-head {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.yt-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red);
  display: flex;
  align-items: center;
  gap: 8px;
}
.yt-eyebrow::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
}
.yt-title {
  font-family: var(--f-mono);
  font-size: clamp(28px, 4vw, 52px);
  font-weight: 700;
  line-height: 1.05;
  margin: 0;
  color: var(--white);
}
.yt-title em {
  font-style: italic;
  color: var(--red);
}
.yt-sub {
  font-size: 14px;
  line-height: 1.6;
  color: rgba(255,255,255,0.55);
  max-width: 48ch;
}
.yt-input-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
  flex-wrap: wrap;
}
.yt-input {
  flex: 1;
  min-width: 220px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 12px;
  color: var(--white);
  font-family: var(--f-mono);
  font-size: 13px;
  letter-spacing: 0.04em;
  outline: none;
  transition: border-color 0.2s;
}
.yt-input::placeholder { color: rgba(255,255,255,0.32); }
.yt-input:focus { border-color: var(--red); }
.yt-load-btn {
  padding: 14px 24px;
  background: var(--red);
  color: #fff;
  border: 0;
  border-radius: 12px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s var(--ease-bounce);
  white-space: nowrap;
}
.yt-load-btn:hover { background: var(--red-deep); transform: scale(1.03); }
.yt-embed-wrap {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
  background: #0a0807;
  border-radius: var(--r-md);
  overflow: hidden;
}
.yt-embed-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: var(--r-md);
}
.yt-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: rgba(255,255,255,0.35);
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.yt-placeholder-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   HERO CARD + FEATURE ICONS + HAMBURGER MENU
   ============================================================ */
/* HERO CARD — single consistent font system: Fraunces (display) + Inter (body) */
.hero-card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 24px;
  padding: 36px 32px;
  box-shadow: 0 24px 60px rgba(20, 18, 14, 0.16), 0 4px 20px rgba(20, 18, 14, 0.06);
  position: relative;
  max-width: 480px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  font-family: var(--f-ui);
}
.hero-spark {
  position: absolute;
  top: 18px; right: 22px;
  font-size: 22px;
  color: var(--orange);
  opacity: 0.7;
}
.hero-card-title {
  font-family: var(--f-display);
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0 0 16px;
}
.hero-card-title em {
  color: var(--red);
  font-style: italic;
  font-weight: 700;
}
.hero-card-line {
  width: 64px;
  height: 3px;
  background: linear-gradient(90deg, var(--red) 0%, rgba(203, 16, 44, 0.2) 100%);
  border-radius: 2px;
  margin-bottom: 18px;
}
.hero-card-sub {
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.6;
  color: var(--muted);
  margin: 0 0 26px;
  max-width: 38ch;
  font-weight: 400;
}
.hero-card-sub strong {
  color: var(--ink);
  font-weight: 600;
}
.hero-card-sub em { font-style: italic; color: var(--ink); }
/* Hero CTA inside the card — clean Inter (no mono), uppercase letterspaced */
.hero-card .hero-cta {
  width: 100%;
  justify-content: center;
  font-family: var(--f-ui) !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  letter-spacing: 0.18em !important;
  text-transform: uppercase !important;
  padding: 16px 24px !important;
}

/* Bottom icons row */
.hero-features {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 24px;
  padding: 18px 22px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(20, 18, 14, 0.12);
  max-width: var(--max);
  margin-left: auto;
  margin-right: auto;
  position: relative;
  z-index: 2;
}
.hero-feature {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px 4px;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.hero-feature:hover {
  transform: translateY(-3px);
  background: rgba(203, 16, 44, 0.05);
}
.hero-feature:active { transform: scale(0.96); }
.hero-feature-icon {
  color: var(--red);
  display: block;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.hero-feature:hover .hero-feature-icon { transform: scale(1.12); }
.hero-feature span {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
  text-align: center;
  line-height: 1.2;
}

/* Mobile hamburger button */
.hamburger {
  display: none;
  position: fixed;
  top: 18px; right: 18px;
  z-index: 1001;
  width: 48px; height: 48px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(20, 18, 14, 0.08);
  border-radius: 14px;
  cursor: pointer;
  padding: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  box-shadow: 0 6px 20px rgba(20, 18, 14, 0.12);
  transition: all 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
.hamburger:active { transform: scale(0.92); }
.hamburger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--ink);
  border-radius: 2px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.hamburger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.is-open span:nth-child(2) { opacity: 0; }
.hamburger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 900px) {
  .hamburger { display: flex; }
  /* Hero on mobile: stack everything, bg image positioned to show bride */
  .hero { min-height: 100vh; overflow: hidden; }
  .hero-bg { background-position: 50% 0% !important; background-size: cover !important; inset: 0 !important; }
  .hero-bottom {
    grid-template-columns: 1fr !important;
    gap: 0 !important;
    padding-bottom: 24px !important;
  }
  /* Hide big "The Bridal Circle" headline — small logo top-left is enough */
  .hero-headline { display: none !important; }
  .hero-rt-stack { align-items: stretch !important; padding: 0 !important; }
  .hero-card {
    margin-top: 60vw;
    padding: 24px 22px;
    border-radius: 20px;
    max-width: 100%;
  }
  .hero-card-title { font-size: clamp(28px, 7.5vw, 38px); }
  .hero-card-sub { font-size: 14px; }
  .hero-features {
    grid-template-columns: repeat(4, 1fr);
    padding: 12px 8px;
    gap: 4px;
    margin-top: 14px;
    border-radius: 16px;
  }
  .hero-feature span { font-size: 9.5px; letter-spacing: 0.12em; }
  .hero-feature-icon { width: 26px; height: 26px; }

  /* Mobile slide-out nav menu */
  .nav-bar {
    position: fixed !important;
    top: 0 !important;
    right: 0 !important;
    left: auto !important;
    width: 78%;
    max-width: 340px;
    height: 100vh;
    background: rgba(255, 255, 255, 0.98) !important;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-direction: column !important;
    align-items: stretch !important;
    justify-content: flex-start !important;
    padding: 88px 28px 32px !important;
    border-radius: 0 !important;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -20px 0 50px rgba(20, 18, 14, 0.18);
    border: none !important;
    z-index: 1000;
    gap: 8px !important;
    overflow-y: auto;
  }
  .nav-bar.is-open { transform: translateX(0); }
  .nav-bar a {
    font-size: 18px !important;
    padding: 14px 16px !important;
    text-align: left;
    border-radius: 12px;
    border-bottom: 1px solid rgba(20, 18, 14, 0.06);
  }
  .nav-bar a:last-of-type { border-bottom: none; }
  .nav-bar .nav-cta-btn {
    margin-top: 16px;
    padding: 16px 22px !important;
    font-size: 14px !important;
    width: 100%;
    justify-content: center;
  }
}
@media (max-width: 480px) {
  .hero-card { padding: 24px 20px; }
  .hero-features { padding: 10px 6px; }
  .hero-feature span { font-size: 9px; }
  .hero-feature-icon { width: 22px; height: 22px; }
}

/* ============================================================
   WAITLIST MODAL
   ============================================================ */
@keyframes wl-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes wl-slide-up { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.wl-overlay {
  position: fixed; inset: 0;
  background: rgba(20,18,14,0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  padding: 20px;
  animation: wl-fade-in 0.28s ease-out;
}
.wl-modal {
  background: var(--bg-card, #fff);
  border-radius: 20px;
  width: 100%;
  max-width: 540px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 36px 32px 28px;
  position: relative;
  box-shadow: 0 40px 80px rgba(0,0,0,0.35);
  animation: wl-slide-up 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-family: var(--f-body, "Inter", sans-serif);
}
.wl-close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-alt, #F0E9DC);
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--ink, #14120E);
  display: flex; align-items: center; justify-content: center;
  transition: background-color 0.2s ease, transform 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.wl-close:hover { background: rgba(203, 16, 44, 0.12); color: var(--red, #CB102C); }
.wl-close:active { transform: scale(0.92); }
.wl-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted, #6E6557);
  margin-bottom: 14px;
}
.wl-eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red, #CB102C); }
.wl-title {
  font-family: var(--f-display, "Fraunces", serif);
  font-size: clamp(28px, 4vw, 38px);
  font-weight: 700;
  margin: 0 0 10px;
  line-height: 1.05;
  letter-spacing: -0.015em;
  color: var(--ink, #14120E);
}
.wl-title em { color: var(--red, #CB102C); font-style: italic; }
.wl-sub { color: var(--muted, #6E6557); font-size: 14px; line-height: 1.55; margin: 0 0 22px; }
.wl-form { display: flex; flex-direction: column; gap: 14px; }
.wl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wl-field { display: flex; flex-direction: column; gap: 6px; }
.wl-field label {
  font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted, #6E6557);
  font-weight: 600;
}
.wl-field input {
  border: 1px solid var(--line, rgba(20,18,14,0.14));
  border-radius: 10px;
  padding: 13px 14px;
  font-size: 15px;
  font-family: inherit;
  background: var(--bg, #FAF7F1);
  color: var(--ink, #14120E);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.wl-field input:focus {
  outline: none;
  border-color: var(--red, #CB102C);
  box-shadow: 0 0 0 3px rgba(203, 16, 44, 0.12);
}
.wl-radio-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wl-radio {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  border: 1.5px solid var(--line, rgba(20,18,14,0.14));
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: var(--bg, #FAF7F1);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.wl-radio input { position: absolute; opacity: 0; pointer-events: none; }
.wl-radio:hover { border-color: var(--red, #CB102C); }
.wl-radio.on {
  border-color: var(--red, #CB102C);
  background: rgba(203, 16, 44, 0.06);
  box-shadow: 0 6px 18px rgba(203, 16, 44, 0.18);
  transform: translateY(-1px);
}
.wl-radio-icon { color: var(--red, #CB102C); display: flex; align-items: center; }
.wl-radio span:not(.wl-radio-icon) { font-size: 14px; font-weight: 600; color: var(--ink, #14120E); }
.wl-submit { margin-top: 8px; width: 100%; justify-content: center; }
.wl-tiny { font-size: 11px; color: var(--muted, #6E6557); margin: 4px 0 0; text-align: center; letter-spacing: 0.04em; }
.wl-success { text-align: center; padding: 12px 0 8px; }
.wl-success-icon { font-size: 44px; color: var(--red, #CB102C); margin-bottom: 14px; line-height: 1; }
.wl-success h3 {
  font-family: var(--f-display, "Fraunces", serif);
  font-size: 28px; font-weight: 700;
  margin: 0 0 10px;
  color: var(--ink, #14120E);
}
.wl-success p { color: var(--muted, #6E6557); font-size: 15px; margin: 0 0 22px; line-height: 1.5; max-width: 36ch; margin-left: auto; margin-right: auto; }
@media (max-width: 540px) {
  .wl-overlay { padding: 10px; align-items: flex-start; padding-top: 16px; }
  .wl-modal { padding: 28px 20px 24px; border-radius: 16px; max-height: calc(100vh - 32px); }
  .wl-row { grid-template-columns: 1fr; }
  .wl-radio-row { grid-template-columns: 1fr; }
  .wl-title { font-size: clamp(24px, 7vw, 30px); }
  .wl-sub { font-size: 13px; margin-bottom: 18px; }
  .wl-field label { font-size: 10px; letter-spacing: 0.14em; }
  .wl-field input { padding: 12px 14px; font-size: 14px; }
  .wl-radio { padding: 12px 14px; }
  .wl-submit { padding: 16px 22px !important; font-size: 12px !important; }
}

/* ============================================================
   INTERACTIVE FEEDBACK — pop, lift, select animations
   ============================================================ */
@keyframes tap-pop-anim {
  0% { transform: scale(1); }
  40% { transform: scale(0.94); }
  70% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

/* Sample bride thumbnails — hover + selected pop */
.thumb {
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease, box-shadow 0.3s ease;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
}
@media (hover: hover) {
  .thumb:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 14px 32px rgba(20,18,14,0.18); }
}
.thumb:active { animation: tap-pop-anim 0.32s ease-out; }
.thumb.is-on {
  transform: scale(1.06);
  box-shadow: 0 12px 30px rgba(203, 16, 44, 0.32);
  outline: 3px solid var(--orange);
  outline-offset: -3px;
}
.thumb.is-on::after {
  content: "✓";
  position: absolute;
  top: 8px; right: 8px;
  width: 28px; height: 28px;
  background: var(--orange);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700;
  box-shadow: 0 4px 12px rgba(203, 16, 44, 0.5);
  animation: tap-pop-anim 0.5s ease-out;
  z-index: 2;
}

/* Mood chips — soft pop */
.chip {
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, box-shadow 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) {
  .chip:hover:not(.is-on) { transform: translateY(-2px); background: var(--bg-alt); }
}
.chip:active { animation: tap-pop-anim 0.32s ease-out; }
.chip.is-on { box-shadow: 0 6px 18px rgba(203, 16, 44, 0.32); transform: translateY(-1px); }

/* Pricing tier cards — interactive lift */
.tier-card {
  transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.32s ease, border-color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) {
  .tier-card:hover { transform: translateY(-6px); box-shadow: 0 22px 48px rgba(20,18,14,0.16); }
}
.tier-card:active { transform: translateY(-2px) scale(0.99); }

/* Primary buttons — pop on tap */
.hero-cta, .form-submit, .join-cta, .nav-cta-btn, .tv-cta {
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, box-shadow 0.28s ease;
  -webkit-tap-highlight-color: transparent;
}
.hero-cta:active, .form-submit:active, .join-cta:active, .nav-cta-btn:active, .tv-cta:active {
  animation: tap-pop-anim 0.35s ease-out;
}

/* Nav links — soft pop on tap */
.nav-bar a {
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.nav-bar a:active { transform: scale(0.92); }

/* Dress preview / wedding-book figures */
#wedding-book figure {
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) {
  #wedding-book figure:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 52px rgba(20,18,14,0.14);
  }
  #wedding-book figure:hover img { transform: scale(1.015); }
}
#wedding-book figure:active { transform: translateY(0) scale(0.995); }
#wedding-book figure img { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

/* Why-cards — small interaction */
.why-card {
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.25s ease, color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) {
  .why-card:hover { transform: translateY(-3px); background: var(--bg-alt); }
}

/* Join perks — slide on hover */
.join-perk {
  transition: transform 0.25s ease, background-color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) {
  .join-perk:hover { transform: translateX(4px); }
}

/* ============================================================
   MOBILE — extra refinements for new sections
   ============================================================ */
@media (max-width: 760px) {
  #wedding-book .section-card { padding: 22px 16px !important; }
  #wedding-book figure { border-radius: 14px; }
  #wedding-book figure figcaption {
    padding: 16px 18px !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
  }
  #wedding-book figure figcaption h3 { font-size: 19px !important; }
  #wedding-book figure figcaption p { font-size: 14px !important; }

  #atelier > .section-card { padding: 22px 16px !important; }
  #atelier h2.section-title { font-size: clamp(28px, 8vw, 40px) !important; line-height: 1.05 !important; }

  .thumb-strip { gap: 10px !important; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .thumb { min-width: 76px !important; min-height: 76px !important; flex: 0 0 auto; }

  .chip-row { gap: 8px !important; flex-wrap: wrap !important; }
  .chip { padding: 9px 14px !important; font-size: 12px !important; }

  .tv-pill { font-size: 12px !important; padding: 10px 14px !important; }

  .why-cards { gap: 10px !important; }

  const bgRef = useRef(null);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      if (!bgRef.current) return;
      const y = window.scrollY;
      bgRef.current.style.setProperty('--parallax', y * 0.35 + 'px');
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const navTo = (id) => {

/* ===== OFFER TIERS ===== */
function Offer({ onBegin }) {
  const ai = [
  { n: "01", kind: "AI Preview", name: "BRIDAL GLIMPSE", cta: "Start preview", price: "89€",
    desc: "A first look — 10 AI-rendered images of you as a bride. Different dresses, different settings, different moods. Perfect to test your direction before committing.",
    list: ["10 bespoke bridal images", "Multiple dress silhouettes", "Multiple venues & moods", "One curated moodboard direction", "Delivered in 48 hours"],
    popular: true },
  { n: "02", kind: "AI Preview", name: "WEDDING BOOK", cta: "Order Wedding Book", price: "399€",
    desc: "The full plan, visualized. Your complete Wedding Book — vision, budget, dress, flowers, venue setup. Everything aligned before you pay a single deposit.",
    list: ["You & your partner styled as bride and groom", "Your venue: flowers, lighting, tables, ceremony setup", "3 complete looks: ceremony, reception, golden hour", "Full wedding budget breakdown — line by line", "Moodboard PDF for your entire vendor team", "Color palette + dress direction + flower recommendations", "1 revision included · Personal call with Eva Creative"],
    medal: true }];

  const renderCard = (t) =>
  <article key={t.n} className={"tier-card v2" + (t.popular ? " is-popular" : "") + (t.medal ? " is-medal" : "")}>
      <header className="tv-head">
        <h3 className="tv-name">{t.name}</h3>
        {t.popular &&
      <div className="tv-tag tv-tag-pop">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M13.5 2c.5 3.5-2 5-2 5C8 7 7 11 7 13a5 5 0 0 0 10 0c0-3-2-4-2-7 0-1.5-1-3-1.5-4z" />
            </svg>
            <span>Most popular</span>
          </div>
      }
        {t.medal &&
      <div className="tv-tag tv-tag-medal" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="9" r="6" />
              <path d="M8.5 14l-2.5 7 4.5-2.5L15 21l-2.5-7" />
            </svg>
          </div>
      }
      </header>
      <div className="tv-price">{t.price}</div>
      <p className="tv-desc">{t.desc}</p>
      <button className="tv-cta" onClick={() => onBegin("ai", t)}>
        <span>{t.cta}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 17 17 7" /><path d="M8 7h9v9" />
        </svg>
      </button>
      <div className="tv-incl-label">What's included:</div>
      <ul className="tv-list">{t.list.map((li, i) => <li key={i}>{li}</li>)}</ul>
    </article>;


  return (
    <React.Fragment>
      {/* AI Preview section */}
      <section className="section">
        <div className="section-card" id="offer">
          <div className="section-head-row tv-head-row">

/* ===== GALLERY — before/after preview (auto-slide on click) ===== */
function BeforeAfterCard({ idx, name }) {
  const [split, setSplit] = useState(50);
  const animRef = useRef(null);
  const runningRef = useRef(false);

  const palettes = [
  { before: "linear-gradient(160deg,#e9dfcd 0%,#bda285 55%,#7a6149 100%)", after: "linear-gradient(160deg,#3a2418 0%,#5a3a26 50%,#2a1810 100%)" },
  { before: "linear-gradient(160deg,#d6c8b4 0%,#9c8775 55%,#5a4838 100%)", after: "linear-gradient(160deg,#2c2a3a 0%,#4a4258 55%,#1c1a28 100%)" },
  { before: "linear-gradient(160deg,#efe3d3 0%,#c9b594 55%,#8a7458 100%)", after: "linear-gradient(160deg,#3a1c1c 0%,#6e2620 50%,#4a1410 100%)" },
  { before: "linear-gradient(160deg,#cdb89a 0%,#8c7560 55%,#4a3a2e 100%)", after: "linear-gradient(160deg,#1f3a30 0%,#2e6552 55%,#0d3a30 100%)" }];

  const p = palettes[(idx - 1) % palettes.length];

  const playSlide = () => {
    if (runningRef.current) return;
    runningRef.current = true;
    const start = performance.now();
    const dur = 2200;
    const ease = (t) => 0.5 - 0.5 * Math.cos(Math.PI * 2 * t);
    const tick = (now) => {
      const t = Math.min(1, (now - start) / dur);
      // sweep: 50 -> 8 -> 92 -> 50
      const v = 50 + (8 - 50) * Math.sin(Math.PI * t) * (t < 0.5 ? 1 : -1);
      // simpler: smooth ping-pong via cosine
      const k = ease(t);
      const pos = t < 0.5 ? 50 - k * 42 : 8 + k * 84;
      setSplit(t < 0.25 ? 50 - t / 0.25 * 42 : t < 0.75 ? 8 + (t - 0.25) / 0.5 * 84 : 92 - (t - 0.75) / 0.25 * 42);
      if (t < 1) animRef.current = requestAnimationFrame(tick);else
      {setSplit(50);runningRef.current = false;}
    };
    animRef.current = requestAnimationFrame(tick);
  };

  useEffect(() => () => animRef.current && cancelAnimationFrame(animRef.current), []);

  return (
    <div className="ba-card ba-card-9x16" style={{ animationDelay: `${(idx - 1) * 90}ms` }}>
      <div className="ba-stage ba-stage-preview ba-stage-9x16" onClick={playSlide}>
        <div className="ba-side ba-before" style={{ backgroundImage: p.before }} />
        <div className="ba-side ba-after" style={{ "--split": `${split}%`, backgroundImage: p.after, backgroundColor: "transparent" }} />
        <span className="ba-tag ba-tag-before">Before</span>
        <span className="ba-tag ba-tag-after">After</span>
        <div className="ba-handle" style={{ "--split": `${split}%` }}>
          <span className="ba-handle-arrow ba-handle-l">‹</span>
          <span className="ba-handle-arrow ba-handle-r">›</span>
        </div>
      </div>
      <div className="ba-foot ba-foot-9x16">
        <div className="ba-foot-num ba-foot-name">{name}</div>
        <div className="ba-foot-num ba-foot-hint">Tap to preview</div>
      </div>
    </div>);

}

/* ===== Scroll-reveal + Why + Join ===== */
function useScrollReveal() {
  useEffect(() => {
    // Auto-tag every section card / hero subhead with reveal so the whole page animates
    document.querySelectorAll('.section-card, .about-card, .contact-card, .gal-card, .tier-card, .stats-card').forEach((el) => {
      if (!el.classList.contains('reveal') && !el.classList.contains('reveal-stagger')) {
        el.classList.add('reveal');
      }
    });
    const els = document.querySelectorAll('.reveal, .reveal-stagger');
    if (!('IntersectionObserver' in window)) {
      els.forEach((el) => el.classList.add('is-visible'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add('is-visible');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function App() {
  const [theme, setTheme] = useState(TWEAK_DEFAULTS.theme);
  const [tweaksOn, setTweaksOn] = useState(false);const [modal, setModal] = useState(null); // { kind, tier }

  useEffect(() => {
    if (theme === "default") document.documentElement.removeAttribute("data-theme");else
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOn(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOn(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  useScrollReveal();

  return (
    <>
      <Hero />
      <Why />
      <Offer onBegin={(kind, tier) => setModal({ kind, tier })} />
      <WeddingBookContents />
      <Vision />
      <Stats />
      <Join />
      <Contact />
      <Footer />
      {modal && <Questionnaire kind={modal.kind} tier={modal.tier} onClose={() => setModal(null)} />}
      {tweaksOn &&
      <div style={{
        position: "fixed", bottom: 24, right: 24, zIndex: 1000,
        background: "rgba(0,0,0,0.85)", backdropFilter: "blur(20px)",
        border: "1px solid rgba(255,255,255,0.15)", borderRadius: 16,
        padding: 20, color: "#fff", fontFamily: "var(--f-display)",
        minWidth: 240, fontSize: 11, letterSpacing: "0.18em"
      }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <span style={{ textTransform: "uppercase" }}>Tweaks</span>
            <button onClick={() => {setTweaksOn(false);window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*");}}
          style={{ background: "none", border: 0, color: "#fff", cursor: "pointer", fontSize: 18 }}>×</button>
          </div>
          <div style={{ marginBottom: 8, color: "#a8a096" }}>Theme</div>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ v: "default", l: "Bold (Black + Orange)" }, { v: "ivory", l: "Ivory" }].map((o) =>
          <button key={o.v}
          onClick={() => {setTheme(o.v);window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { theme: o.v } }, "*");}}
          style={{
            flex: 1, padding: "10px 8px", fontSize: 9, letterSpacing: "0.16em",
            textTransform: "uppercase", borderRadius: 8, cursor: "pointer",
            background: theme === o.v ? "#E8742A" : "rgba(255,255,255,0.08)",
            border: theme === o.v ? "1px solid #E8742A" : "1px solid rgba(255,255,255,0.12)",
            color: "#fff", fontFamily: "inherit"
          }}>{o.l}</button>
          )}
          </div>
        </div>
      }
    </>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
